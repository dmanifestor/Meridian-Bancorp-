<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Bancorp</title>
    <meta name="description" content="Meridian Bancorp Private Client & Institutional Banking Portal, featuring secure client authentication, asset custody, multi-tier treasury management, and high-frequency digital trading." />
    <meta property="og:title" content="Meridian Bancorp" />
    <meta property="og:description" content="Meridian Bancorp Private Client & Institutional Banking Portal, featuring secure client authentication, asset custody, multi-tier treasury management, and high-frequency digital trading." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // GitHub Pages path normalizer: ensures trailing slash on directory URLs so relative assets resolve properly
      (function() {
        var l = window.location;
        var path = l.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          l.replace(path + '/' + l.search + l.hash);
        }
      })();
    </script>
    <script>
      // Global diagnostic catcher for script or stylesheet load failures
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var src = target.src || target.href || 'resource';
          console.error('Resource load failure:', src);
          var notice = document.getElementById('meridian-loader-notice');
          if (notice) {
            notice.innerHTML = '<div style="margin-top:12px;padding:10px 14px;background:rgba(239,68,68,0.2);border:1px solid #ef4444;border-radius:8px;color:#fca5a5;font-size:12px;text-align:left;max-width:400px;margin:10px auto 0;">' +
              '<div style="font-weight:700;margin-bottom:4px;color:#f87171;">Application Bundle Load Error</div>' +
              '<div style="font-size:11px;color:#e2e8f0;word-break:break-all;margin-bottom:8px;">Failed resource: ' + src + '</div>' +
              '<div style="font-size:11px;color:#94a3b8;line-height:1.4;">If deploying to GitHub Pages, ensure the URL ends with a slash <code>/</code> and GitHub Pages deployment settings are active.</div>' +
              '<div style="margin-top:10px;display:flex;gap:8px;">' +
              '<button onclick="window.location.reload()" style="background:#facc15;color:#050c1e;border:none;padding:5px 12px;border-radius:4px;font-weight:700;font-size:11px;cursor:pointer;">Retry</button>' +
              '<button onclick="window.location.href=window.location.pathname.replace(/\\/?$/, \'/\')" style="background:#2563eb;color:#ffffff;border:none;padding:5px 12px;border-radius:4px;font-weight:600;font-size:11px;cursor:pointer;">Open with /</button>' +
              '</div>' +
              '</div>';
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#050c1e] text-white min-h-screen" style="background-color: #050c1e; margin: 0; color: #ffffff;">
    <div id="root">
      <div id="meridian-loader" style="min-height: 100vh; background-color: #050c1e; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(250, 204, 21, 0.2); border-top-color: #facc15; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="margin-top: 18px; font-weight: 800; font-size: 17px; letter-spacing: 0.05em; color: #facc15;">MERIDIAN BANCORP</div>
        <div id="meridian-loader-notice" style="margin-top: 6px; font-size: 12px; color: #94a3b8; font-family: monospace;">Loading Institutional Portal...</div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var loader = document.getElementById('meridian-loader');
        if (loader) {
          var notice = document.getElementById('meridian-loader-notice');
          if (notice && !notice.innerHTML.includes('Application Bundle Load Error')) {
            notice.innerHTML = 'Still loading? <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;"><button onclick="window.location.reload()" style="background:#facc15;color:#050c1e;border:none;padding:6px 14px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;">Refresh Portal</button><button onclick="try{localStorage.clear();}catch(e){}window.location.hash=\'homepage\';window.location.reload();" style="background:#1e3a8a;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer;">Reset Cache</button></div>';
          }
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
