<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Bancorp</title>
    <script>
      // Single Page Apps for GitHub Pages SPA redirection
      // Translates direct pathname visits into hash routes
      (function() {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var hash = path ? '#' + path : '';
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body style="background-color: #050c1e; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #facc15;">Redirecting to Meridian Bancorp...</h2>
      <p style="color: #94a3b8;">If you are not redirected automatically, <a href="./" style="color: #60a5fa;">click here</a>.</p>
    </div>
  </body>
</html>
